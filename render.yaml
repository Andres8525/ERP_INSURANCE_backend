services:
  - type: web
    name: erp-insurance-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: erp
      - key: DB_POOL_SIZE
        value: "5"
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_TTL_MINUTES
        value: "240"
      - key: BCRYPT_STRENGTH
        value: "10"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DEMO_SEED
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
  - type: web
    name: erp-realtime-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./realtime-gateway/Dockerfile
    dockerContext: ./realtime-gateway
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
