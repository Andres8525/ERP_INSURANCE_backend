# Blueprint de Render: https://render.com/docs/blueprint-spec
# Render construye la imagen con el Dockerfile y asigna el puerto en la variable PORT.
# Las variables con "sync: false" se piden en el panel al crear el servicio (no se guardan en git).
services:
  - type: web
    name: erp-insurance-api
    runtime: docker
    plan: free
    # Misma región que Supabase (us-west-2 / Oregón) para reducir la latencia con la base de datos.
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: erp
      - key: DB_POOL_SIZE
        value: "5"
      # Debe ser LA MISMA que en backend/.env: los datos de Supabase están cifrados con ella.
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Sesión de 4 h: evita volver a iniciar sesión durante una demostración.
      - key: JWT_TTL_MINUTES
        value: "240"
      # BCrypt 10: login ~4x más rápido que con 12 en la CPU compartida del plan free.
      - key: BCRYPT_STRENGTH
        value: "10"
      # URL del frontend (Vercel), p. ej. https://erp-insurance.vercel.app,https://*.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false
      # Los datos demo ya están en Supabase; no volver a sembrar.
      - key: DEMO_SEED
        value: "false"
      # Plan free = 512 MB de RAM. ExitOnOutOfMemoryError hace que Render reinicie el servicio
      # en lugar de dejar una JVM sin memoria respondiendo con errores.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
