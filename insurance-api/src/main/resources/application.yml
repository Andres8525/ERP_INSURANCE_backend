server:
  # SERVER_PORT (local) > PORT (lo asigna Render y otros PaaS) > 8080
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful
  # Detrás del proxy HTTPS de Render: respeta X-Forwarded-Proto/Host.
  forward-headers-strategy: framework
  # Gzip para JSON grandes (pipeline, anomalías, pacientes): menos bytes por la red hacia Vercel.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1024

spring:
  application:
    name: erp-insurance-api
  config:
    # Variables locales en backend/.env (ignorado por git). Las variables de entorno reales tienen prioridad.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    # Sin SPRING_PROFILES_ACTIVE la API arranca en modo demo (H2 en memoria + datos semilla).
    # PostgreSQL propio: SPRING_PROFILES_ACTIVE=prod. Supabase: SPRING_PROFILES_ACTIVE=supabase.
    default: demo
    group:
      supabase: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_insurance}
    username: ${DB_USERNAME:erp_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carga perezosa en lotes: el pipeline y la bandeja de anomalías dejan de hacer una consulta
        # por fila (N+1) para pacientes, servicios e historial; importante con la latencia de Supabase.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    # Coste de BCrypt (4-31). Cada +1 duplica el tiempo de login.
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    # Autoregistro de usuarios (rol AGENT) desde la pantalla de login.
    allow-registration: ${ALLOW_REGISTRATION:true}
  encryption:
    key: ${ENCRYPTION_KEY:}
  cors:
    # Orígenes o patrones separados por coma, p. ej. https://mi-app.vercel.app,https://*.vercel.app
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:3000}
  anomaly-engine:
    address: ${ANOMALY_ENGINE_ADDRESS:}
    tls: ${ANOMALY_ENGINE_TLS:false}
    deadline: ${ANOMALY_ENGINE_DEADLINE:8s}
    fallback-in-process: ${ANOMALY_ENGINE_FALLBACK:true}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi