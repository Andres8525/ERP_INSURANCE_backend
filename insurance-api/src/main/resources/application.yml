server:
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain,text/csv
    min-response-size: 1024

spring:
  application:
    name: erp-insurance-api
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    default: demo
    group:
      supabase: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_insurance}
    username: ${DB_USERNAME:erp_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    allow-registration: ${ALLOW_REGISTRATION:true}
  encryption:
    key: ${ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:3000}
  anomaly-engine:
    address: ${ANOMALY_ENGINE_ADDRESS:}
    tls: ${ANOMALY_ENGINE_TLS:false}
    deadline: ${ANOMALY_ENGINE_DEADLINE:8s}
    fallback-in-process: ${ANOMALY_ENGINE_FALLBACK:true}
  ai:
    provider: ${AI_PROVIDER:auto}
    api-key: ${AI_API_KEY:${GROK_API_KEY:}}
    base-url: ${AI_BASE_URL:${GROK_BASE_URL:}}
    model: ${AI_MODEL:${GROK_MODEL:}}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:60s}
    temperature: ${AI_TEMPERATURE:0.2}
    max-tokens: ${AI_MAX_TOKENS:4000}
    max-anomalies: ${AI_MAX_ANOMALIES:200}
    cache-ttl: ${AI_CACHE_TTL:10m}
    reasoning-effort: ${AI_REASONING_EFFORT:}
  retention:
    archive-after-months: ${RETENTION_ARCHIVE_AFTER_MONTHS:12}
    retention-years: ${RETENTION_YEARS:7}
    hot-usd-per-gb-month: ${RETENTION_HOT_USD_PER_GB:0.023}
    archive-usd-per-gb-month: ${RETENTION_ARCHIVE_USD_PER_GB:0.004}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi
