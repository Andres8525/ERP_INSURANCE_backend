spring:
  datasource:
    url: jdbc:h2:mem:erp_insurance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    jwt-secret: ${JWT_SECRET:demo-only-jwt-secret-change-me-0123456789abcdef}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:480}
  encryption:
    key: ${ENCRYPTION_KEY:ZGVtby1vbmx5LWVuY3J5cHRpb24ta2V5LTMyYnl0ZXM=}
  demo:
    seed: true
