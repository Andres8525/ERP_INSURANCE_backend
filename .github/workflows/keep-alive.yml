name: Keep alive

# Render (plan free) suspende el servicio tras 15 min sin tráfico y el arranque en frío tarda ~1 min.
# Este workflow hace ping cada 10 min a /actuator/health, que además consulta la base de datos:
# mantiene despierta la API y activo el proyecto de Supabase.
# Notas: GitHub puede retrasar las ejecuciones programadas unos minutos y las desactiva
# tras 60 días sin actividad en el repositorio. Un solo servicio 24/7 cabe en las 750 h/mes de Render free.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping a la API
        env:
          # Se puede cambiar con una variable del repositorio (Settings > Variables > RENDER_HEALTH_URL).
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://erp-insurance-api.onrender.com/actuator/health' }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o response.json -w "%{http_code}" --max-time 120 "$HEALTH_URL" || true)
            echo "Intento $attempt: HTTP $status $(cat response.json 2>/dev/null)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::La API no respondió 200 en $HEALTH_URL"
          exit 1
