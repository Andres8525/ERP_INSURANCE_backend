name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping a la API
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://erp-insurance-api.onrender.com/actuator/health' }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o response.json -w "%{http_code}" --max-time 120 "$HEALTH_URL" || true)
            echo "Intento $attempt: HTTP $status $(cat response.json 2>/dev/null)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::La API no respondió 200 en $HEALTH_URL"
          exit 1
