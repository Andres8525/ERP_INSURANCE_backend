services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_insurance
      POSTGRES_USER: erp_app
      POSTGRES_PASSWORD: erp_local_password
    ports:
      - "5432:5432"
    volumes:
      - erp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_app -d erp_insurance"]
      interval: 5s
      retries: 10

  anomaly-engine:
    build:
      context: .
      dockerfile: anomaly-engine/Dockerfile
    environment:
      GRPC_PORT: "9090"
    ports:
      - "9090:9090"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      anomaly-engine:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/erp_insurance
      DB_USERNAME: erp_app
      DB_PASSWORD: erp_local_password
      ENCRYPTION_KEY: bG9jYWwtZG9ja2VyLWVuY3J5cHRpb24ta2V5LTMyYj0=
      JWT_SECRET: local-docker-jwt-secret-change-me-0123456789
      FRONTEND_ORIGINS: http://localhost:4200
      BOOTSTRAP_ADMIN_EMAIL: admin@nexo.local
      BOOTSTRAP_ADMIN_PASSWORD: LocalAdminPassword2026!
      ANOMALY_ENGINE_ADDRESS: anomaly-engine:9090
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "8080:8080"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  realtime-a: &realtime
    build:
      context: realtime-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8090"
      INSTANCE_ID: realtime-a
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-docker-jwt-secret-change-me-0123456789
      FRONTEND_ORIGINS: http://localhost:4200

  realtime-b:
    <<: *realtime
    environment:
      PORT: "8090"
      INSTANCE_ID: realtime-b
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-docker-jwt-secret-change-me-0123456789
      FRONTEND_ORIGINS: http://localhost:4200

  realtime-lb:
    image: nginx:1.27-alpine
    depends_on:
      - realtime-a
      - realtime-b
    volumes:
      - ./realtime-gateway/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:8090"

volumes:
  erp-db:
