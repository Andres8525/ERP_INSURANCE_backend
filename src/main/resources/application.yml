server:
  # SERVER_PORT (local) > PORT (lo asigna Render y otros PaaS) > 8080
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful
  # Detrás del proxy HTTPS de Render: respeta X-Forwarded-Proto/Host.
  forward-headers-strategy: framework

spring:
  application:
    name: erp-insurance-api
  config:
    # Variables locales en backend/.env (ignorado por git). Las variables de entorno reales tienen prioridad.
    import: optional:file:.env[.properties]
  profiles:
    # Sin SPRING_PROFILES_ACTIVE la API arranca en modo demo (H2 en memoria + datos semilla).
    # PostgreSQL propio: SPRING_PROFILES_ACTIVE=prod. Supabase: SPRING_PROFILES_ACTIVE=supabase.
    default: demo
    group:
      supabase: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_insurance}
    username: ${DB_USERNAME:erp_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    # Autoregistro de usuarios (rol AGENT) desde la pantalla de login.
    allow-registration: ${ALLOW_REGISTRATION:true}
  encryption:
    key: ${ENCRYPTION_KEY:}
  cors:
    # Orígenes o patrones separados por coma, p. ej. https://mi-app.vercel.app,https://*.vercel.app
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:3000}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi